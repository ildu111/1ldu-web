<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1LDU — D variants</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E0C0A;
  --text: #F0EDE6;
  --accent: #4A6741;
  --muted: rgba(240,237,230,0.55);
  --light-bg: #b8bfc5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 300;
  background: var(--bg);
  color: var(--text);
}

.label-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 0 60px;
  gap: 0;
}
.col-label {
  text-align: center;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 20px 0 12px;
}

.band {
  padding: 60px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  align-items: center;
}
.band--dark { background: var(--bg); border-bottom: 1px solid rgba(240,237,230,0.08); }
.band--mid  { background: #4a4f53; border-bottom: 1px solid rgba(240,237,230,0.08); }
.band--light { background: var(--light-bg); }

.band-label {
  position: absolute;
}

.variant {
  text-align: center;
}

/* Shared h1 base */
.variant h1 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: clamp(2.5rem, 5vw, 4.5rem);
  font-weight: 300;
  letter-spacing: 0.08em;
  line-height: 1;
  color: var(--text);
  display: inline-block;
}

/* Light background: letters in dark */
.band--light .variant h1 {
  color: var(--bg);
}

/* --- CURRENT --- */
.v-current h1 .d {
  color: var(--accent);
}

/* --- A: weight 400 --- */
.v-a h1 .d {
  color: var(--accent);
  font-weight: 400;
}

/* --- B: glow --- */
.v-b h1 .d {
  color: var(--accent);
  text-shadow: 0 0 32px rgba(74,103,65,0.85), 0 0 12px rgba(74,103,65,0.5);
}

/* --- C: weight + glow --- */
.v-c h1 .d {
  color: var(--accent);
  font-weight: 400;
  text-shadow: 0 0 32px rgba(74,103,65,0.85), 0 0 12px rgba(74,103,65,0.5);
}

/* Band side label */
.bg-label {
  writing-mode: vertical-rl;
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 16px;
  align-self: center;
}
.band--light .bg-label { color: rgba(14,12,10,0.4); }

.band-inner {
  display: grid;
  grid-template-columns: 28px repeat(4, 1fr);
  padding: 60px 40px;
  gap: 0;
  align-items: center;
}

.band-inner.dark  { background: var(--bg); }
.band-inner.mid   { background: #4a4f53; border-top: 1px solid rgba(240,237,230,0.06); border-bottom: 1px solid rgba(240,237,230,0.06); }
.band-inner.light { background: var(--light-bg); }

footer-note {
  display: block;
  text-align: center;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: var(--muted);
  padding: 40px;
}
</style>
</head>
<body>

<!-- Column labels -->
<div style="display:grid; grid-template-columns: 28px repeat(4,1fr); padding: 40px 40px 0; gap:0;">
  <div></div>
  <div style="text-align:center; font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); padding-bottom:12px;">Current</div>
  <div style="text-align:center; font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); padding-bottom:12px;">A — weight 400</div>
  <div style="text-align:center; font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); padding-bottom:12px;">B — glow</div>
  <div style="text-align:center; font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); padding-bottom:12px;">C — weight + glow</div>
</div>

<!-- DARK -->
<div class="band-inner dark">
  <span class="bg-label">Dark</span>
  <div class="variant v-current">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-a">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-b">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-c">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
</div>

<!-- MID -->
<div class="band-inner mid">
  <span class="bg-label">Mid</span>
  <div class="variant v-current">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-a">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-b">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-c">
    <h1>1L<span class="d">D</span>U</h1>
  </div>
</div>

<!-- LIGHT -->
<div class="band-inner light">
  <span class="bg-label" style="color:rgba(14,12,10,0.35)">Light</span>
  <div class="variant v-current">
    <h1 style="color:var(--bg)">1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-a">
    <h1 style="color:var(--bg)">1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-b">
    <h1 style="color:var(--bg)">1L<span class="d">D</span>U</h1>
  </div>
  <div class="variant v-c">
    <h1 style="color:var(--bg)">1L<span class="d">D</span>U</h1>
  </div>
</div>

<div style="text-align:center; font-size:0.6rem; letter-spacing:0.2em; color:var(--muted); padding:32px;">
  Dark = fons fosc / Mid = zona grisa / Light = zona clara de la foto
</div>

</body>
</html>
